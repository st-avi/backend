name: cd

on:
  push:
    branches: [ main ]

env:
  GO_VERSION: '1.27.3'

jobs:
  lint:
    uses: ./.github/workflows/lint.yaml

  deploy:
    needs: lint
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Verify dependencies
        run: go mod verify

      - name: Build executable
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o main main.go

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          platforms: linux/amd64

      - name: Build docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: manifest/docker/Dockerfile
          load: true
          tags: backend:dev
          platforms: linux/amd64

      - name: Save docker image
        run: |
          docker save backend:dev -o ./backend-dev.tar

      - name: Upload image to Server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOST }}
          port: ${{ secrets.PORT }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
          source: "./backend-dev.tar,./api/example"
          target: ${{ secrets.TARGET_PATH }}

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          port: ${{ secrets.PORT }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
          script: |
            cd ${{ secrets.TARGET_PATH }}
            [[ -f compose.yaml ]] && docker compose down
            docker system prune -f
            docker rmi backend:dev || true
            docker load -i ./backend-dev.tar
            docker compose up -d